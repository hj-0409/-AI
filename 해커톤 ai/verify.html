<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><title>verify report</title></head>
<body style="margin:0">
<iframe id="f" src="index.html" style="width:1280px;height:900px;border:0"></iframe>
<script>
const f = document.getElementById('f');
f.addEventListener('load', () => {
  setTimeout(() => {
    const w = f.contentWindow, d = f.contentDocument;

    // Blob 다운로드를 가로채서 생성된 HTML을 검사
    let captured = null, capturedName = null;
    const origCreate = w.URL.createObjectURL.bind(w.URL);
    w.URL.createObjectURL = (blob) => { captured = blob; return origCreate(blob); };
    const origClick = w.HTMLAnchorElement.prototype.click;
    w.HTMLAnchorElement.prototype.click = function () { capturedName = this.download; };

    w.openCompany('SK하이닉스');
    setTimeout(() => {
      w.openDetail('SK하이닉스', 'process');
      setTimeout(async () => {
        // 1) 상세 리포트
        w.downloadDetailReport();
        console.log('파일명 =', capturedName);
        const txt = await captured.text();
        console.log('길이 =', txt.length);
        console.log('DOCTYPE 시작 =', txt.trim().slice(0, 15).includes('<!DOCTYPE'));
        console.log('style 닫힘 =', txt.includes('</style>'));
        console.log('html 닫힘 =', txt.trim().endsWith('</html>'));
        console.log('회사명 =', txt.includes('SK하이닉스'));
        console.log('Minitab =', txt.includes('Minitab'));
        console.log('HBM3E =', txt.includes('HBM3E'));
        console.log('SKCT =', txt.includes('SKCT'));
        console.log('매칭점수 블록 =', txt.includes('/100'));
        console.log('프로필요약 =', txt.includes('내 프로필 요약'));
        console.log('상태이모지 =', /🟢|🟡|🔴/.test(txt));

        // 2) 비교 리포트
        w.toggleCurrentPin();
        w.openCompany('ASML');
        setTimeout(() => {
          w.openDetail('ASML', 'cse');
          setTimeout(async () => {
            w.toggleCurrentPin();
            captured = null;
            w.downloadCompareReport();
            console.log('--- 비교 리포트 ---');
            console.log('파일명 =', capturedName);
            const t2 = await captured.text();
            console.log('길이 =', t2.length);
            console.log('두 회사 포함 =', t2.includes('SK하이닉스') && t2.includes('ASML'));
            console.log('비교표 =', t2.includes('기업 · 직무 비교'));
            console.log('html 닫힘 =', t2.trim().endsWith('</html>'));
          }, 500);
        }, 500);
      }, 600);
    }, 600);
  }, 2200);
});
</script>
</body></html>
