name: Update Jobs Data

on:
  schedule:
    # 매주 월요일 00:00 UTC (한국 시간 오전 9시)
    - cron: '0 0 * * 1'
  workflow_dispatch: # Actions 탭에서 수동 실행 버튼 활성화

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 환경 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 데이터 업데이트 스크립트 실행
        run: |
          python update_jobs.py

      - name: 변경 사항 Git 커밋 및 푸시
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/companies.json
          git commit -m "chore: 채용 일정 및 최신 이슈 자동 갱신 [skip ci]" || echo "No changes to commit"
          git push
